[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retail-refund"
version = "0.1.0"
description = "Retail Refund Management Backend and MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
backend = [
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "filetype>=1.2.0",
    "httpx>=0.28.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "PyJWT>=2.10.0",
    "email-validator>=2.2.0",
]

dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

mcp_server = [
    "python-dotenv>=1.0.1",
    "fastembed>=0.9.1",
    "fastmcp>=4.1.5",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.7.3",
    "openai>=1.50.0",
    "psycopg[binary,pool]>=3.3.6",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

worker = [
    "arq>=0.28.0",
    "boto3>=1.43.123",
    "pydantic>=2.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pillow>=13.0.0",
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "langchain-core>=0.3.0",
    "langgraph>=1.2.20",
    "redis>=5.3.1",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.3",
    "catboost>=1.2.10",
    "python-dotenv>=1.0.1",
    "langfuse>=4.7.0,<5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = [
    "backend",
    "knowledge",
    "mcp_server",
    "worker",
]
